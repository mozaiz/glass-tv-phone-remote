name: Build

# Every push and pull request builds the APK. A version tag (v1.2.0) also publishes it as a GitHub
# release, signed with the release key from the repository secrets, with its SHA-256 next to it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4

      # Every build in this repository is signed with the release key, so any build's artifact installs
      # over a release. Pull requests from forks get no secrets and fall back to the debug key.
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No release key available; this build is signed with the debug key."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "A release needs the key."; exit 1; fi
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore/keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          ls -l app/build/outputs/apk/release/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="PhoneRemote-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$TAG" "$apk" "$apk.sha256" --title "Phone Remote $TAG" --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneRemote-apk
          path: app/build/outputs/apk/release/app-release.apk
