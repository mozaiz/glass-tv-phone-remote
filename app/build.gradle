plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zmk.tvremote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zmk.tvremote'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }

    // Releases are signed with one key kept out of git: keystore/ locally, GitHub secrets in CI
    // (.github/workflows/build.yml writes the same files). Without it, builds fall back to the debug key.
    def props = new Properties()
    def propsFile = rootProject.file('keystore/keystore.properties')
    if (propsFile.exists()) propsFile.withInputStream { props.load(it) }
    signingConfigs {
        release {
            if (props['storeFile']) {
                storeFile rootProject.file('keystore/' + props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 strips the unused parts of ZXing; proguard-rules.pro keeps Injector, started by name on the box.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig propsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // QR codes on the TV screen (Apache 2.0).
    implementation 'com.google.zxing:core:3.5.3'
}
